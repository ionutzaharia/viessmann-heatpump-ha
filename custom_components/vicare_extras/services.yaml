set_circulation_schedule:
  description: >-
    Set the weekly time program of the DHW circulation pump. Days you omit are
    set to empty (pump off that day). Each entry needs start/end (HH:MM),
    and a mode supported by your device (see the switch entity's
    available_modes attribute, e.g. "on", "5/25-cycles").
  fields:
    mon:
      description: List of schedule entries for Monday.
      example: '[{"start": "06:00", "end": "08:00", "mode": "on"}]'
      selector:
        object:
    tue:
      description: List of schedule entries for Tuesday.
      selector:
        object:
    wed:
      description: List of schedule entries for Wednesday.
      selector:
        object:
    thu:
      description: List of schedule entries for Thursday.
      selector:
        object:
    fri:
      description: List of schedule entries for Friday.
      selector:
        object:
    sat:
      description: List of schedule entries for Saturday.
      selector:
        object:
    sun:
      description: List of schedule entries for Sunday.
      selector:
        object:

set_dhw_schedule:
  description: >-
    Set the weekly domestic hot water time program (the periods when the heat
    pump produces hot water). Days you omit are set to empty. Typical modes:
    "normal", "top".
  fields:
    mon:
      description: List of schedule entries for Monday.
      example: '[{"start": "05:00", "end": "22:00", "mode": "normal"}]'
      selector:
        object:
    tue:
      description: List of schedule entries for Tuesday.
      selector:
        object:
    wed:
      description: List of schedule entries for Wednesday.
      selector:
        object:
    thu:
      description: List of schedule entries for Thursday.
      selector:
        object:
    fri:
      description: List of schedule entries for Friday.
      selector:
        object:
    sat:
      description: List of schedule entries for Saturday.
      selector:
        object:
    sun:
      description: List of schedule entries for Sunday.
      selector:
        object:

override_schedules:
  description: >-
    Boost: save the current DHW and circulation pump plans, switch both to
    always-on, and automatically restore the saved plans after the given
    number of minutes. Calling again while active extends the timer (the
    originally saved plans are kept). Survives Home Assistant restarts.
  fields:
    minutes:
      description: How long the override should last.
      required: true
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes

cancel_override:
  description: >-
    End an active schedule override now and restore the saved DHW and
    circulation pump plans immediately.

comfort_warm_water:
  description: >-
    Inertia-aware comfort boost: trigger a one-time DHW charge, wait until the
    tank reaches the DHW setpoint minus 2 K (checked every 2 minutes, max 50
    minutes), then switch DHW + circulation schedules to always-on for the
    given duration and restore the previous plans afterwards.
  fields:
    minutes:
      description: >-
        Boost duration after the tank is hot. Defaults to the Override
        duration number entity.
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes

cancel_comfort:
  description: >-
    Abort the comfort sequence: deactivate the one-time charge if still
    charging, and/or end the schedule override and restore the saved plans.

get_schedules:
  description: >-
    Return the current circulation pump schedule, its available modes, and the
    DHW time program. Useful to copy, edit, and re-post via the set services.
